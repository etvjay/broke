# kane-cli metric catalog, version 1.
#
# Policies reference these as metrics.<name>. `where` and `value` expressions
# are CEL over `test` (one tests/*/result.yaml, parsed), `file` and `run`
# (run.yaml, parsed); `expr` is CEL over `run`, `tests`, `totals`, `failures`.
# A test's run_kind sits in its result.yaml environment on testrun packs and in
# run.yaml environment on single-test packs.
catalog: kane-cli
version: 1
min_producer: "0.8.10"
description: Metrics read from the files kane-cli writes into an evidence pack.
metrics:
  # Tests whose steps contain no assert step. Analyze steps read a value and
  # pass whatever they read, so they do not count as checks.
  tests_without_checks:
    type: count
    unit: tests
    label: Tests without checks
    per_test: true
    verify:
      aggregate: count
      where: "!test.steps.exists(s, has(s.kind) && s.kind == 'assert')"
    merge: recompute
    min_producer: "0.8.10"
  # Tests that failed on replay and passed after adaptive heal re-authored them.
  heal.healed_tests:
    type: count
    unit: tests
    label: Healed tests
    per_test: true
    verify:
      aggregate: count
      where: "has(test.adaptive_heal) && has(test.adaptive_heal.outcome) && test.adaptive_heal.outcome == 'healed'"
    merge: recompute
    min_producer: "0.8.10"
  # Tests that still failed after adaptive heal spent its retry budget.
  heal.exhausted_tests:
    type: count
    unit: tests
    label: Heal-exhausted tests
    per_test: true
    verify:
      aggregate: count
      where: "has(test.adaptive_heal) && has(test.adaptive_heal.outcome) && test.adaptive_heal.outcome == 'exhausted'"
    merge: recompute
    min_producer: "0.8.10"
  # Steps adaptive heal re-authored, summed over the tests where a heal was
  # triggered. Forced-author runs also write reauthored_steps but triggered
  # is false there, so they are left out.
  heal.reauthored_steps:
    type: count
    unit: steps
    label: Re-authored steps
    per_test: true
    verify:
      aggregate: sum
      path: adaptive_heal.reauthored_steps
      where: "has(test.adaptive_heal) && test.adaptive_heal.triggered && has(test.adaptive_heal.reauthored_steps)"
    merge: recompute
    min_producer: "0.8.10"
  # Tests whose run_kind is not replay, so the verdict rests on an authoring
  # run rather than a recorded one.
  non_replay_tests:
    type: count
    unit: tests
    label: Non-replay tests
    per_test: true
    verify:
      aggregate: count
      where: "(has(test.environment) && has(test.environment.run_kind) ? test.environment.run_kind : (has(run.environment.run_kind) ? run.environment.run_kind : 'author')) != 'replay'"
    merge: recompute
    min_producer: "0.8.10"
  # Tests whose attempts disagreed, divided by all tests.
  flaky_rate:
    type: ratio
    unit: fraction of tests
    label: Flaky rate
    range: [0, 1]
    per_test: true
    verify:
      expr: "size(tests) == 0 ? 0.0 : double(tests.filter(t, has(t.flaky) && t.flaky == true).size()) / double(size(tests))"
    merge: recompute
    min_producer: "0.8.10"
